name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Inspect package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > pack-dry-run.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const [{ files }] = JSON.parse(fs.readFileSync("pack-dry-run.json", "utf8"));
          const allowed = /^(extension\/.+|LICENSE|README\.md|package\.json)$/;
          const unexpected = files.map(({ path }) => path).filter((path) => !allowed.test(path));
          if (unexpected.length) throw new Error(`Unexpected package files: ${unexpected.join(", ")}`);
          NODE
